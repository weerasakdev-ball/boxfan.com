<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a3661">
<title>โปรแกรมชก · Schedule — Boxfan</title>
<meta name="description" content="โปรแกรมการแข่งขันมวย ONE Championship มวยไทย MMA ที่จะมีขึ้น">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boxfan-theme.css">
<script>(function(){try{var s=localStorage.getItem('boxfan-theme');if(s==='dark'||s==='light')document.documentElement.setAttribute('data-theme',s);}catch(e){}})();</script>
<style>
.sch-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:640px){.sch-stats{grid-template-columns:repeat(2,1fr)}}
.month-hd{background:var(--navy);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:3px 3px 0 0;margin-top:14px}
.match{background:var(--paper);border:1px solid var(--line);border-top:0;padding:12px 14px;display:grid;grid-template-columns:80px 1fr 1fr auto;gap:14px;align-items:center;transition:background .1s;cursor:pointer}
.match:hover{background:var(--hover)}
.match:last-child{border-radius:0 0 3px 3px}
.match-date{text-align:center;padding:6px;border:1px solid var(--line);border-radius:3px;flex-shrink:0}
.match-date .d{font-family:'Inter';font-weight:800;font-size:20px;color:var(--red);line-height:1}
.match-date .m{font-size:9px;font-weight:700;color:var(--tx-3);text-transform:uppercase;margin-top:2px}
.match-date .cd{font-size:9px;color:var(--red);margin-top:3px;font-weight:700}
.match-side{display:flex;align-items:center;gap:10px;min-width:0}
.match-side.b{flex-direction:row-reverse;text-align:right}
.match-side.b .fx-info{text-align:right}
.match-vs{text-align:center;color:var(--tx-3);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.match-info{text-align:right;font-size:11px;color:var(--tx-3)}
.match-info .event{color:var(--tx-2);font-weight:600;margin-bottom:2px}
@media(max-width:768px){
  .match{grid-template-columns:60px 1fr;gap:10px}
  .match-side.b,.match-vs,.match-info{grid-column:2}
  .match-side.b{flex-direction:row;text-align:left}
  .match-side.b .fx-info{text-align:left}
  .match-vs{text-align:left;margin:3px 0}
  .match-date .d{font-size:16px}
}
</style>
</head>
<body>

<div id="bf-chrome"></div>

<div class="crumb">
  <a href="index.html">หน้าแรก</a><span class="sep">›</span><span>โปรแกรมชก</span>
</div>

<div class="page-hd">
  <div class="kicker"><svg viewBox="0 0 24 24"><use href="#i-calendar"/></svg> Fight Schedule · โปรแกรมชก</div>
  <h1>โปรแกรม<em>การแข่งขัน</em></h1>
  <p class="sub">ไฟต์ทั้งหมดที่กำหนดวันแล้ว จัดกลุ่มตามเดือน — ล่าสุดขึ้นก่อน</p>
</div>

<div class="wrap full">
  <!-- Stat mini cards -->
  <div class="sch-stats">
    <div class="stat-mini">
      <div class="stat-mini-ic"><svg viewBox="0 0 24 24"><use href="#i-calendar"/></svg></div>
      <div class="stat-mini-body">
        <div class="stat-mini-val" id="st-matches">–</div>
        <div class="stat-mini-lbl">ไฟต์ที่จะมา</div>
      </div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-ic"><svg viewBox="0 0 24 24"><use href="#i-clock"/></svg></div>
      <div class="stat-mini-body">
        <div class="stat-mini-val" id="st-next">–</div>
        <div class="stat-mini-lbl">อีกกี่วัน (ไฟต์ถัดไป)</div>
      </div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-ic"><svg viewBox="0 0 24 24"><use href="#i-users"/></svg></div>
      <div class="stat-mini-body">
        <div class="stat-mini-val" id="st-fighters">–</div>
        <div class="stat-mini-lbl">นักมวยที่เกี่ยวข้อง</div>
      </div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-ic"><svg viewBox="0 0 24 24"><use href="#i-globe"/></svg></div>
      <div class="stat-mini-body">
        <div class="stat-mini-val" id="st-events">–</div>
        <div class="stat-mini-lbl">รายการทั้งหมด</div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <span class="fl-label">กรอง</span>
    <select id="f-div">
      <option value="">รุ่นทั้งหมด</option>
      <option value="atom">อะตอม</option>
      <option value="straw">สตรอว์</option>
      <option value="fly">ฟลาย</option>
      <option value="bantam">แบนตัม</option>
      <option value="feather">เฟเธอร์</option>
      <option value="light">ไลท์</option>
      <option value="welter">เวลเทอร์</option>
      <option value="heavy">เฮฟวี</option>
      <option value="catch">แคช</option>
    </select>
    <select id="f-rules">
      <option value="">กติกาทั้งหมด</option>
      <option value="มวยไทย">มวยไทย</option>
      <option value="คิกบ็อกซิง">คิกบ็อกซิง</option>
      <option value="MMA">MMA</option>
    </select>
    <input type="text" id="f-event" class="grow" placeholder="ค้นหารายการ / ชื่อนักมวย...">
    <button class="btn subtle" id="f-reset">ล้าง</button>
  </div>

  <div id="schedule"></div>
</div>

<div id="bf-foot"></div>

<script src="data/fighters_data.js"></script>
<script src="utils.js"></script>
<script src="boxfan-shared.js"></script>

<script>
(function(){
  'use strict';
  bfMount('schedule');

  if(typeof HISTORY === 'undefined'){
    document.getElementById('schedule').innerHTML = '<div class="empty">ไม่พบข้อมูล</div>';
    return;
  }

  var TODAY = new Date().toISOString().slice(0,10);
  var FMAP = {}, FBYNAME = {};
  FIGHTERS.forEach(function(f){ FMAP[f.id] = f; FBYNAME[f.name_th] = f; if(f.name_en) FBYNAME[f.name_en] = f; });

  function isUpcoming(h){ return h.result_type === 'upcoming' || h.result === 'รอแข่งขัน' || (h.date && h.date > TODAY && !h.result_type); }

  // build unique matches
  function buildMatches(){
    var raw = HISTORY.filter(function(h){ return isUpcoming(h) && h.date && h.date >= TODAY; });
    var seen = {};
    var out = [];
    raw.forEach(function(h){
      var key = [h.fighter_id, h.opponent].sort().join('|') + '|' + h.date;
      if(seen[key]) return;
      seen[key] = true;
      out.push(h);
    });
    out.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    return out;
  }

  var ALL = buildMatches();

  // stat cards
  (function(){
    document.getElementById('st-matches').textContent = ALL.length;
    if(ALL.length){
      var d = Math.round((new Date(ALL[0].date) - new Date(TODAY))/86400000);
      document.getElementById('st-next').textContent = d === 0 ? 'วันนี้' : d + ' วัน';
      var fs = {};
      ALL.forEach(function(h){ if(h.fighter_id) fs[h.fighter_id]=1; if(h.opponent) fs[h.opponent]=1; });
      document.getElementById('st-fighters').textContent = Object.keys(fs).length;
      var evs = {};
      ALL.forEach(function(h){ if(h.event) evs[h.event]=1; });
      document.getElementById('st-events').textContent = Object.keys(evs).length;
    } else {
      document.getElementById('st-next').textContent = '–';
      document.getElementById('st-fighters').textContent = '0';
      document.getElementById('st-events').textContent = '0';
    }
  })();

  var state = { div:'', rules:'', q:'' };

  function apply(){
    var arr = ALL.slice();
    if(state.div) arr = arr.filter(function(h){ return divKey(h.division) === state.div || (FMAP[h.fighter_id] && divKey(FMAP[h.fighter_id].division) === state.div); });
    if(state.rules) arr = arr.filter(function(h){ return (h.rules||'').indexOf(state.rules)>-1; });
    if(state.q){
      var q = state.q.toLowerCase();
      arr = arr.filter(function(h){
        var fA = FMAP[h.fighter_id];
        return (h.event||'').toLowerCase().indexOf(q)>-1 ||
          (fA?fA.name_th.toLowerCase().indexOf(q)>-1:false) ||
          (fA?(fA.name_en||'').toLowerCase().indexOf(q)>-1:false) ||
          (h.opponent||'').toLowerCase().indexOf(q)>-1;
      });
    }
    return arr;
  }

  var TMONTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var TMONTH_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

  function render(){
    var arr = apply();
    var wrap = document.getElementById('schedule');
    if(!arr.length){
      wrap.innerHTML = '<div class="empty">ไม่มีไฟต์ตามเงื่อนไข</div>';
      return;
    }
    // group by month
    var groups = {}, order = [];
    arr.forEach(function(h){
      var k = h.date.slice(0,7);
      if(!groups[k]){ groups[k] = []; order.push(k); }
      groups[k].push(h);
    });
    wrap.innerHTML = order.map(function(k){
      var mo = parseInt(k.slice(5,7))-1, yr = parseInt(k.slice(0,4))+543;
      var head = '<div class="month-hd">'+TMONTH_FULL[mo]+' '+yr+' — '+groups[k].length+' ไฟต์</div>';
      var items = groups[k].map(function(h){
        var fA = FMAP[h.fighter_id];
        var fB = FBYNAME[h.opponent];
        var d = new Date(h.date);
        var diff = Math.round((d - new Date(TODAY))/86400000);
        var cd = '';
        if(diff === 0) cd = 'วันนี้';
        else if(diff === 1) cd = 'พรุ่งนี้';
        else if(diff > 0 && diff <= 7) cd = 'อีก '+diff+' วัน';

        function panel(f, fallbackName, fallbackCountry, side){
          var img = f ? cImg(f.image_filename,'sm') : PH;
          var nm = f ? f.name_th : (fallbackName || '—');
          var meta = f ? fl(f.country) : (fallbackCountry ? fl(fallbackCountry) : '');
          var link = f ? fighterUrl(f) : '#';
          return '<a class="match-side '+side+'" href="'+link+'" onclick="event.stopPropagation()" style="color:inherit">'+
            '<div class="fx-img"><img src="'+img+'" loading="lazy" onerror="this.onerror=null;this.src=PH" alt=""></div>'+
            '<div class="fx-info">'+
              '<div class="fx-name">'+esc(nm)+'</div>'+
              '<div class="fx-meta">'+meta+' '+esc(f?f.division:(h.division||''))+'</div>'+
            '</div>'+
          '</a>';
        }
        var cmpUrl = (fA && fB) ? ('compare.html?a='+encodeURIComponent(fA.id)+'&b='+encodeURIComponent(fB.id)) : '';
        return '<div class="match" '+(cmpUrl?'onclick="location.href=\''+cmpUrl+'\'"':'')+'>'+
          '<div class="match-date">'+
            '<div class="d">'+d.getDate()+'</div>'+
            '<div class="m">'+TMONTH[d.getMonth()]+'</div>'+
            (cd?'<div class="cd">'+cd+'</div>':'')+
          '</div>'+
          panel(fA, null, null, 'a')+
          '<div class="match-vs">VS</div>'+
          panel(fB, h.opponent, h.opponent_country, 'b')+
          '<div class="match-info"><div class="event">'+esc(h.event||'')+'</div><div>'+esc(h.rules||'')+'</div></div>'+
        '</div>';
      }).join('');
      return head + items;
    }).join('');
  }

  var qi = document.getElementById('f-event'), qt;
  qi.addEventListener('input', function(){ clearTimeout(qt); qt = setTimeout(function(){ state.q = qi.value.trim(); render(); }, 150); });
  document.getElementById('f-div').addEventListener('change', function(){ state.div = this.value; render(); });
  document.getElementById('f-rules').addEventListener('change', function(){ state.rules = this.value; render(); });
  document.getElementById('f-reset').addEventListener('click', function(){
    state.div=''; state.rules=''; state.q='';
    qi.value=''; document.getElementById('f-div').value=''; document.getElementById('f-rules').value='';
    render();
  });

  render();

  if(typeof setMeta === 'function') setMeta({
    title:'โปรแกรมชก · Schedule', titleEn:'Schedule',
    desc:'โปรแกรมมวย ONE Championship มวยไทย MMA | Boxfan',
    url:'https://boxingfandom.com/schedule.html', keywords:'โปรแกรมชก,ตารางมวย'
  });
})();
</script>
</body>
</html>
