<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a3661">
<title>อันดับนักมวย · ตารางคะแนน — Boxfan</title>
<meta name="description" content="ตารางอันดับนักมวยเต็ม แยกรุ่นน้ำหนัก คิกบ็อกซิง มวยไทย MMA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boxfan-theme.css">
<script>(function(){try{var s=localStorage.getItem('boxfan-theme');if(s==='dark'||s==='light')document.documentElement.setAttribute('data-theme',s);}catch(e){}})();</script>
</head>
<body>

<div id="bf-chrome"></div>

<div class="crumb">
  <a href="index.html">หน้าแรก</a><span class="sep">›</span><span>อันดับนักมวย</span>
</div>

<div class="page-hd">
  <div class="kicker"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg> Rankings · ตารางคะแนน</div>
  <h1>อันดับ<em>นักมวย</em></h1>
  <p class="sub">จัดอันดับตามคะแนนสะสมจากผลการแข่งขันจริง — ชนะ +3, ชนะน็อกยกแรก +1, เสมอ +1, แพ้ -3</p>
</div>

<div class="wrap full">
  <!-- FILTER BAR -->
  <div class="filter-bar">
    <input type="text" id="fp-search" class="grow" placeholder="ค้นหาชื่อนักมวย...">
    <select id="fp-div">
      <option value="">รุ่นทั้งหมด</option>
      <option value="atom">อะตอมเวท</option>
      <option value="straw">สตรอว์เวท</option>
      <option value="fly">ฟลายเวท</option>
      <option value="bantam">แบนตัมเวท</option>
      <option value="feather">เฟเธอร์เวท</option>
      <option value="light">ไลท์เวท</option>
      <option value="welter">เวลเทอร์เวท</option>
      <option value="middle">มิดเดิลเวท</option>
      <option value="heavy">เฮฟวีเวท</option>
      <option value="catch">แคชเวท</option>
    </select>
    <select id="fp-country">
      <option value="">ทุกประเทศ</option>
    </select>
    <select id="fp-yr">
      <option value="">ทุกปี</option>
    </select>
    <button class="btn subtle" id="fp-reset">ล้างตัวกรอง</button>
    <span style="margin-left:auto;font-size:12px;color:var(--tx-3)">พบ <b id="fp-count" style="color:var(--navy)">–</b> คน</span>
  </div>

  <!-- MAIN TABLE -->
  <div class="card">
    <div class="card-hd">
      <div class="card-hd-l"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg> ตารางอันดับเต็ม</div>
      <span id="fp-badge" style="color:#c8d4e8;font-size:11px">ทุกรุ่น</span>
    </div>
    <div style="overflow-x:auto">
      <table class="dtbl" id="tbl">
        <thead>
          <tr>
            <th style="width:44px">#</th>
            <th class="l">นักมวย</th>
            <th class="sortable" data-sort="fights" style="width:60px">ไฟต์</th>
            <th class="sortable desc" data-sort="wins" style="width:60px">W</th>
            <th class="sortable" data-sort="losses" style="width:60px">L</th>
            <th class="sortable" data-sort="wr" style="width:70px">%WR</th>
            <th class="sortable desc" data-sort="score" style="width:64px">PTS</th>
            <th class="sortable" data-sort="streak" style="width:70px">Streak</th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<div id="bf-foot"></div>

<script src="data/fighters_data.js"></script>
<script src="utils.js"></script>
<script src="boxfan-shared.js"></script>

<script>
(function(){
  'use strict';
  bfMount('rankings');

  if(typeof FIGHTERS === 'undefined'){
    document.getElementById('tbl-body').innerHTML = '<tr><td colspan="8" class="empty">ไม่พบข้อมูล</td></tr>';
    return;
  }

  // pre-compute
  FIGHTERS.forEach(function(f){
    var h = hist(f.id);
    f._score = score(h);
    var st = fightStreak(h);
    f._streak = st.streak;
    f._lastDate = st.lastDate;
    f._fights = f.total_fights || (f.total_wins + f.total_losses + f.total_draws);
    f._wr = f._fights ? Math.round(f.total_wins / f._fights * 100) : 0;
  });

  // ── Build country + year dropdowns ──
  (function(){
    var countries = {}, years = {};
    FIGHTERS.forEach(function(f){ if(f.country) countries[f.country] = true; });
    HISTORY.forEach(function(h){ if(h.date) years[h.date.slice(0,4)] = true; });
    var cSel = document.getElementById('fp-country');
    Object.keys(countries).sort().forEach(function(c){
      var o = document.createElement('option'); o.value = c; o.textContent = c; cSel.appendChild(o);
    });
    var ySel = document.getElementById('fp-yr');
    Object.keys(years).sort().reverse().forEach(function(y){
      var o = document.createElement('option'); o.value = y; o.textContent = y; ySel.appendChild(o);
    });
  })();

  var state = {
    q:'', div:'', country:'', year:'',
    sortBy:'score', sortDir:'desc',
    page:1, perPage:20
  };

  function apply(){
    var arr = FIGHTERS.slice();
    if(state.q){
      var q = state.q.toLowerCase();
      arr = arr.filter(function(f){
        return (f.name_th||'').toLowerCase().indexOf(q)>-1 || (f.name_en||'').toLowerCase().indexOf(q)>-1;
      });
    }
    if(state.div) arr = arr.filter(function(f){ return divKey(f.division) === state.div; });
    if(state.country) arr = arr.filter(function(f){ return (f.country||'').indexOf(state.country)>-1; });
    if(state.year){
      arr = arr.filter(function(f){
        return hist(f.id).some(function(h){ return h.date && h.date.slice(0,4) === state.year; });
      });
    }
    var dir = state.sortDir === 'desc' ? -1 : 1;
    arr.sort(function(a,b){
      var va, vb;
      switch(state.sortBy){
        case 'fights': va=a._fights; vb=b._fights; break;
        case 'wins': va=a.total_wins||0; vb=b.total_wins||0; break;
        case 'losses': va=a.total_losses||0; vb=b.total_losses||0; break;
        case 'wr': va=a._wr; vb=b._wr; break;
        case 'streak': va=a._streak; vb=b._streak; break;
        case 'score': default: va=a._score; vb=b._score;
      }
      if(va !== vb) return dir * (va < vb ? -1 : 1);
      return String(b._lastDate||'').localeCompare(String(a._lastDate||''));
    });
    return arr;
  }

  function render(){
    var arr = apply();
    document.getElementById('fp-count').textContent = arr.length;
    document.getElementById('fp-badge').textContent = state.div ? divLabel(state.div) : 'ทุกรุ่น';
    var total = arr.length;
    var totalPages = Math.max(1, Math.ceil(total / state.perPage));
    if(state.page > totalPages) state.page = 1;
    var start = (state.page-1) * state.perPage;
    var slice = arr.slice(start, start + state.perPage);

    var body = document.getElementById('tbl-body');
    if(!slice.length){
      body.innerHTML = '<tr><td colspan="8" class="empty">ไม่พบนักมวยที่ตรงเงื่อนไข</td></tr>';
      document.getElementById('pager').innerHTML = '';
      return;
    }
    body.innerHTML = slice.map(function(f, i){
      var rank = start + i + 1;
      var rankCls = rank<=3 ? 'rk-no top3' : 'rk-no';
      var streakBadge = f._streak >= 3 ? ' <span class="bd bd-win">'+f._streak+' รวด</span>' : '';
      return '<tr class="clk" onclick="location.href=\''+fighterUrl(f)+'\'">'+
        '<td><span class="'+rankCls+'">'+rank+'</span></td>'+
        '<td class="l">'+bfFxCell(f,{badge:streakBadge})+'</td>'+
        '<td>'+f._fights+'</td>'+
        '<td class="c-w">'+(f.total_wins||0)+'</td>'+
        '<td class="c-l">'+(f.total_losses||0)+'</td>'+
        '<td>'+f._wr+'%</td>'+
        '<td class="r c-pts">'+f._score+'</td>'+
        '<td>'+(f._streak||0)+'</td>'+
      '</tr>';
    }).join('');

    // Pager
    var p = document.getElementById('pager');
    if(totalPages <= 1){ p.innerHTML = ''; return; }
    var html = '<button '+(state.page===1?'disabled':'')+' onclick="_goPage(1)">«</button>';
    html += '<button '+(state.page===1?'disabled':'')+' onclick="_goPage('+(state.page-1)+')">‹</button>';
    var maxShow = 5;
    var s = Math.max(1, state.page - Math.floor(maxShow/2));
    var e = Math.min(totalPages, s + maxShow - 1);
    if(e - s < maxShow - 1) s = Math.max(1, e - maxShow + 1);
    for(var pg = s; pg <= e; pg++){
      html += '<button '+(pg===state.page?'class="active"':'')+' onclick="_goPage('+pg+')">'+pg+'</button>';
    }
    html += '<button '+(state.page===totalPages?'disabled':'')+' onclick="_goPage('+(state.page+1)+')">›</button>';
    html += '<button '+(state.page===totalPages?'disabled':'')+' onclick="_goPage('+totalPages+')">»</button>';
    p.innerHTML = html;

    // Update sort arrows
    document.querySelectorAll('th.sortable').forEach(function(th){
      th.classList.remove('asc','desc');
      if(th.getAttribute('data-sort') === state.sortBy) th.classList.add(state.sortDir);
    });
  }

  window._goPage = function(n){ state.page = n; render(); window.scrollTo({top:0,behavior:'smooth'}); };

  // Wire filters
  var q = document.getElementById('fp-search');
  var qt;
  q.addEventListener('input', function(){
    clearTimeout(qt);
    qt = setTimeout(function(){ state.q = q.value.trim(); state.page = 1; render(); }, 150);
  });
  document.getElementById('fp-div').addEventListener('change', function(){ state.div = this.value; state.page = 1; render(); });
  document.getElementById('fp-country').addEventListener('change', function(){ state.country = this.value; state.page = 1; render(); });
  document.getElementById('fp-yr').addEventListener('change', function(){ state.year = this.value; state.page = 1; render(); });
  document.getElementById('fp-reset').addEventListener('click', function(){
    state.q=''; state.div=''; state.country=''; state.year=''; state.page=1;
    q.value=''; document.getElementById('fp-div').value=''; document.getElementById('fp-country').value=''; document.getElementById('fp-yr').value='';
    render();
  });
  // Sort clicks
  document.querySelectorAll('th.sortable').forEach(function(th){
    th.addEventListener('click', function(){
      var col = this.getAttribute('data-sort');
      if(state.sortBy === col){
        state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
      } else {
        state.sortBy = col; state.sortDir = 'desc';
      }
      render();
    });
  });

  render();

  if(typeof setMeta === 'function') setMeta({
    title:'อันดับนักมวย · ตารางคะแนน', titleEn:'Rankings',
    desc:'ตารางอันดับนักมวยเต็ม แยกรุ่นน้ำหนัก | Boxfan',
    url:'https://boxingfandom.com/rankings.html', keywords:'อันดับนักมวย,ตารางคะแนน'
  });
})();
</script>
</body>
</html>
