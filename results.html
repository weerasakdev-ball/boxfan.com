<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a3661">
<title>ผลการแข่งขัน · Results — Boxfan</title>
<meta name="description" content="ผลการแข่งขันมวย ONE Championship มวยไทย MMA ครบทุกไฟต์">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boxfan-theme.css">
<script>(function(){try{var s=localStorage.getItem('boxfan-theme');if(s==='dark'||s==='light')document.documentElement.setAttribute('data-theme',s);}catch(e){}})();</script>
<style>
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:640px){.res-stats{grid-template-columns:1fr}}
.ev{margin-bottom:14px}
.ev-hd{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;border-radius:3px 3px 0 0;cursor:pointer;user-select:none}
.ev-hd-l{display:flex;align-items:center;gap:10px;min-width:0}
.ev-hd-date{background:var(--red);color:#fff;padding:3px 8px;border-radius:2px;font-size:11px;font-weight:700;flex-shrink:0}
.ev-hd-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-hd-chev svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;transition:transform .2s}
.ev.open .ev-hd-chev svg{transform:rotate(180deg)}
.ev-body{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 3px 3px;display:none}
.ev.open .ev-body{display:block}
.res-row{padding:10px 14px;border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:1fr auto 1fr 90px;gap:12px;align-items:center;transition:background .1s}
.res-row:hover{background:var(--hover)}
.res-row:last-child{border-bottom:0}
.res-row .side{display:flex;align-items:center;gap:8px;min-width:0}
.res-row .side.b{flex-direction:row-reverse}
.res-row .side.b .fx-info{text-align:right}
.res-row .side.winner .fx-name{color:var(--win)}
.res-row .method{text-align:center;font-size:11px;color:var(--tx-3);line-height:1.3}
.res-row .method .m{color:var(--tx);font-weight:600}
[data-theme="dark"] .res-row .method .m{color:var(--tx-2)}
.res-row .stars{text-align:right;font-size:11px;color:var(--red);font-weight:700}
@media(max-width:768px){
  .res-row{grid-template-columns:1fr auto 1fr;gap:8px}
  .res-row .stars{grid-column:1/-1;text-align:left;padding-top:4px;border-top:1px dashed var(--line-2)}
}
</style>
</head>
<body>

<div id="bf-chrome"></div>

<div class="crumb">
  <a href="index.html">หน้าแรก</a><span class="sep">›</span><span>ผลการแข่งขัน</span>
</div>

<div class="page-hd">
  <div class="kicker"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg> Results · ผลการแข่งขัน</div>
  <h1>ผล<em>การแข่งขัน</em></h1>
  <p class="sub">ผลไฟต์ที่จบไปแล้วทั้งหมด จัดกลุ่มตามรายการ — คลิกที่ชื่อรายการเพื่อดูรายละเอียด</p>
</div>

<div class="wrap full">
  <div class="res-stats">
    <div class="stat-mini">
      <div class="stat-mini-ic"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg></div>
      <div class="stat-mini-body"><div class="stat-mini-val" id="st-fi">–</div><div class="stat-mini-lbl">ไฟต์ที่จบแล้ว</div></div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-ic"><svg viewBox="0 0 24 24"><use href="#i-glove"/></svg></div>
      <div class="stat-mini-body"><div class="stat-mini-val" id="st-ko">–</div><div class="stat-mini-lbl">ชนะน็อก/TKO</div></div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-ic"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg></div>
      <div class="stat-mini-body"><div class="stat-mini-val" id="st-ev">–</div><div class="stat-mini-lbl">รายการทั้งหมด</div></div>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="sf-q" class="grow" placeholder="ค้นหาชื่อรายการ / นักมวย...">
    <select id="sf-rules">
      <option value="">กติกาทั้งหมด</option>
      <option value="มวยไทย">มวยไทย</option>
      <option value="คิกบ็อกซิง">คิกบ็อกซิง</option>
      <option value="MMA">MMA</option>
      <option value="ปล้ำจับล็อก">ปล้ำจับล็อก</option>
    </select>
    <select id="sf-year">
      <option value="">ทุกปี</option>
    </select>
    <button class="btn subtle" id="sf-reset">ล้าง</button>
    <span style="margin-left:auto;font-size:12px;color:var(--tx-3)">พบ <b id="found-count" style="color:var(--navy)">–</b> ไฟต์</span>
  </div>

  <div id="area"></div>
  <div style="text-align:center;padding:20px" id="lm-wrap" hidden>
    <button class="btn" id="lm" style="padding:10px 24px">แสดงรายการเพิ่มเติม</button>
  </div>
</div>

<div id="bf-foot"></div>

<script src="data/fighters_data.js"></script>
<script src="utils.js"></script>
<script src="boxfan-shared.js"></script>

<script>
(function(){
  'use strict';
  bfMount('results');

  if(typeof HISTORY === 'undefined'){
    document.getElementById('area').innerHTML = '<div class="empty">ไม่พบข้อมูล</div>';
    return;
  }

  var TODAY = new Date().toISOString().slice(0,10);
  var FMAP = {}, FBYNAME = {};
  FIGHTERS.forEach(function(f){ FMAP[f.id] = f; FBYNAME[f.name_th] = f; if(f.name_en) FBYNAME[f.name_en] = f; });

  function isKO(m){ return /ko|tko|น็อก|น๊อก|knockout|ทีเคโอ|เคโอ/i.test(m||''); }

  // build unique fights (dedupe pair+date)
  var seen = {};
  var UNIQ = [];
  HISTORY.forEach(function(h){
    if(!(h.date && h.date <= TODAY)) return;
    if(['win','loss','draw','nc'].indexOf(h.result_type) === -1) return;
    var key = [h.fighter_id, h.opponent].sort().join('|') + '|' + h.date;
    if(seen[key]) return;
    seen[key] = true;
    UNIQ.push(h);
  });
  UNIQ.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });

  // Stats
  document.getElementById('st-fi').textContent = UNIQ.length;
  document.getElementById('st-ko').textContent = UNIQ.filter(function(h){ return h.result_type==='win' && (isKO(h.decision) || h.method==='ko'||h.method==='tko'); }).length;
  var evSet = {};
  UNIQ.forEach(function(h){ if(h.event) evSet[h.event] = 1; });
  document.getElementById('st-ev').textContent = Object.keys(evSet).length;

  // Year dropdown
  (function(){
    var ys = {};
    UNIQ.forEach(function(h){ ys[h.date.slice(0,4)] = 1; });
    var sel = document.getElementById('sf-year');
    Object.keys(ys).sort().reverse().forEach(function(y){
      var o = document.createElement('option'); o.value = y; o.textContent = y; sel.appendChild(o);
    });
  })();

  var state = { q:'', rules:'', year:'', shown:6 };
  var STEP = 6;

  function apply(){
    var arr = UNIQ.slice();
    if(state.rules) arr = arr.filter(function(h){ return (h.rules||'').indexOf(state.rules)>-1; });
    if(state.year) arr = arr.filter(function(h){ return h.date.slice(0,4) === state.year; });
    if(state.q){
      var q = state.q.toLowerCase();
      arr = arr.filter(function(h){
        var fA = FMAP[h.fighter_id];
        return (h.event||'').toLowerCase().indexOf(q)>-1 ||
          (fA?fA.name_th.toLowerCase().indexOf(q)>-1:false) ||
          (fA?(fA.name_en||'').toLowerCase().indexOf(q)>-1:false) ||
          (h.opponent||'').toLowerCase().indexOf(q)>-1;
      });
    }
    return arr;
  }

  function render(){
    var arr = apply();
    document.getElementById('found-count').textContent = arr.length;
    if(!arr.length){
      document.getElementById('area').innerHTML = '<div class="empty">ไม่พบไฟต์ตามเงื่อนไข</div>';
      document.getElementById('lm-wrap').hidden = true;
      return;
    }
    // Group by event
    var groups = {}, order = [];
    arr.forEach(function(h){
      var key = (h.event||'ไม่ระบุรายการ') + '|' + (h.date||'');
      if(!groups[key]){ groups[key] = {event:h.event, date:h.date, items:[]}; order.push(key); }
      groups[key].items.push(h);
    });
    var slice = order.slice(0, state.shown);
    var html = slice.map(function(k, idx){
      var g = groups[k];
      var d = new Date(g.date);
      var dateS = d.getDate()+' '+['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][d.getMonth()]+' '+(d.getFullYear()+543);
      var body = g.items.map(function(h){
        var fA = FMAP[h.fighter_id];
        var fB = FBYNAME[h.opponent];
        var winner = h.result_type === 'win' ? 'a' : (h.result_type === 'loss' ? 'b' : null);
        function panel(f, fallbackName, side, isWin){
          var img = f ? cImg(f.image_filename,'sm') : PH;
          var nm = f ? f.name_th : (fallbackName || '—');
          var link = f ? fighterUrl(f) : '#';
          var country = f ? f.country : '';
          return '<a class="side '+side+(isWin?' winner':'')+'" href="'+link+'" style="color:inherit">'+
            '<div class="fx-img"><img src="'+img+'" loading="lazy" onerror="this.onerror=null;this.src=PH" alt=""></div>'+
            '<div class="fx-info"><div class="fx-name">'+esc(nm)+(isWin?' <span class="bd bd-win">W</span>':'')+'</div>'+
            '<div class="fx-meta">'+fl(country)+' '+esc(f?f.division:'')+'</div></div>'+
          '</a>';
        }
        var method = h.decision || (h.method?h.method.toUpperCase():'');
        var starHtml = '';
        if(h.fight_rating_stars){
          for(var s=0;s<h.fight_rating_stars;s++) starHtml += '<svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:currentColor;stroke:none;display:inline-block;vertical-align:-1px"><use href="#i-star"/></svg>';
        }
        return '<div class="res-row">'+
          panel(fA, null, 'a', winner==='a')+
          '<div class="method"><div class="m">'+esc(method||'—')+'</div><div>R'+(h.round||'-')+(h.time?' · '+h.time:'')+'</div></div>'+
          panel(fB, h.opponent, 'b', winner==='b')+
          '<div class="stars">'+starHtml+'</div>'+
        '</div>';
      }).join('');
      return '<div class="ev '+(idx<3?'open':'')+'" data-idx="'+idx+'">'+
        '<div class="ev-hd" onclick="_toggleEv(this)">'+
          '<div class="ev-hd-l"><span class="ev-hd-date">'+dateS+'</span><span class="ev-hd-t">'+esc(g.event||'ไม่ระบุรายการ')+'</span><span style="color:#c8d4e8;font-size:11px">('+g.items.length+' ไฟต์)</span></div>'+
          '<div class="ev-hd-chev"><svg viewBox="0 0 24 24"><use href="#i-chev-down"/></svg></div>'+
        '</div>'+
        '<div class="ev-body">'+body+'</div>'+
      '</div>';
    }).join('');
    document.getElementById('area').innerHTML = html;
    document.getElementById('lm-wrap').hidden = order.length <= state.shown;
    document.getElementById('lm').textContent = 'แสดงเพิ่มเติม ('+Math.min(STEP, order.length - state.shown)+' จาก '+(order.length - state.shown)+' รายการ)';
  }

  window._toggleEv = function(el){ el.parentElement.classList.toggle('open'); };

  var q = document.getElementById('sf-q'), qt;
  q.addEventListener('input', function(){ clearTimeout(qt); qt = setTimeout(function(){ state.q = q.value.trim(); state.shown = STEP; render(); }, 150); });
  document.getElementById('sf-rules').addEventListener('change', function(){ state.rules = this.value; state.shown = STEP; render(); });
  document.getElementById('sf-year').addEventListener('change', function(){ state.year = this.value; state.shown = STEP; render(); });
  document.getElementById('sf-reset').addEventListener('click', function(){
    state.q=''; state.rules=''; state.year=''; state.shown = STEP;
    q.value=''; document.getElementById('sf-rules').value=''; document.getElementById('sf-year').value='';
    render();
  });
  document.getElementById('lm').addEventListener('click', function(){ state.shown += STEP; render(); });

  render();

  if(typeof setMeta === 'function') setMeta({
    title:'ผลการแข่งขัน · Results', titleEn:'Results',
    desc:'ผลการแข่งขันมวย ONE Championship มวยไทย MMA | Boxfan',
    url:'https://boxingfandom.com/results.html', keywords:'ผลมวย,results'
  });
})();
</script>
</body>
</html>
